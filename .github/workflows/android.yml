# Builds and tests every push and pull request. Pushing a tag like v0.2.1 also
# publishes a GitHub release with the APK, which the app's "Check for updates" finds.
name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :ir-core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Name the APK
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then NAME="$(git rev-parse --short HEAD)"; fi
          cp app/build/outputs/apk/debug/app-debug.apk "universal-ir-$NAME.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-ir-apk
          path: universal-ir-*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ir-core/build/reports/tests
            app/build/reports/tests

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: universal-ir-*.apk
          generate_release_notes: true
